<rect x="36.400000000000006" y="615" width="417.2" height="17" fill="#fff" opacity="0.92"/>
<text x="245.0" y="629" text-anchor="middle" fill="#222">11. EMR reads completed Task + DiagnosticReport + Observations</text>
